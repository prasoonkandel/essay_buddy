<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="./styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Essay Buddy</title>
  </head>
  <body>
    <header><h1>Essay Buddy</h1></header>
    <form>
      <div class="topic">
        <span>Topic:</span>
        <input
          type="text"
          id="topic"
          name="topic"
          placeholder="Enter the topic for the essay..."
        />
      </div>
      <div class="word_count">
        <span>Word Count:</span>
        <select name="word_count" id="word_count">
          <option value="250">Short (250 words)</option>
          <option value="500">Medium (500 words)</option>
          <option value="750">Long (750 words)</option>
          <option value="1500">Very Long (1500 words)</option>
        </select>
      </div>
    </form>
    <div class="cursor-trail">
      <div class="circle"></div>
      <div class="circle"></div>
      <div class="circle"></div>
      <div class="circle"></div>
      <div class="circle"></div>
      <div class="circle"></div>
      <div class="circle"></div>
      <div class="circle"></div>
      <div class="circle"></div>
      <div class="circle"></div>
      <div class="circle"></div>
      <div class="circle"></div>
      <div class="circle"></div>
      <div class="circle"></div>
      <div class="circle"></div>
      <div class="circle"></div>
    </div>
    <script src="./script.js"></script>
  </body>
</html>
